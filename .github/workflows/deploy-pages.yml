name: Deploy GitHub Pages

on:
  push:
    branches:
      - source
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run c && npm run b

      - name: Copy custom domain
        run: cp ./CNAME ./dist/CNAME

      - name: Inject Google verification
        env:
          GOOGLE_VERIFICATION: ${{ secrets.GOOGLE_VERIFICATION }}
        run: |
          if [ -n "$GOOGLE_VERIFICATION" ]; then
            sed -i "/<meta charset=\"UTF-8\">/a\\    <meta name=\"google-site-verification\" content=\"${GOOGLE_VERIFICATION}\"/>" dist/index.html
          fi

      - name: Verify build output
        run: |
          test -s dist/index.html
          test -s dist/css/style.css
          test -s dist/js/script.js

      - name: Package Pages artifact
        run: |
          tar --dereference --hard-dereference --directory dist -cvf github-pages.tar .
          gzip -f github-pages.tar

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ./github-pages.tar.gz
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
